<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignaciones</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('https://wallpapers.com/images/high/ps4-theme-bu6p671ib8bunf48.webp') no-repeat center center / cover;
            color: #ffffff;
        }

        .container {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
            color: #ffcc00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table, th, td {
            border: 1px solid #ffffff;
        }

        th, td {
            padding: 10px;
            text-align: left;
            color: #ffffff;
        }

        th {
            background-color: #333;
        }

        td {
            position: relative;
        }

        td button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ff3333;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        td button:hover {
            background-color: #cc0000;
        }

        input[type="text"], input[type="number"] {
            width: calc(100% - 40px);
            padding: 8px;
            border: none;
            border-radius: 4px;
            color: #000;
        }

        button {
            background-color: #ffcc00;
            color: #000;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #ffaa00;
        }

        .total, .horas {
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 10px;
        }

        .horas {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .horas input {
            width: 80px;
            padding: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Asignaciones</h1>
        <button onclick="insertarFila()">Agregar Asignación</button>
        <table id="tablaAsignaciones">
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        <div class="total">Total: <span id="totalSum">0</span></div>
        <div class="horas">
            <span>Horas a cargar en el mes:</span>
            <input type="number" id="horasInput" min="0">
        </div>
    </div>

    <script>
        function cargarDatosDesdeCookies() {
            const datosGuardados = JSON.parse(localStorage.getItem('asignaciones')) || [];
            const horasGuardadas = localStorage.getItem('horasMes') || '';
            document.getElementById('horasInput').value = horasGuardadas;

            const tbody = document.querySelector('#tablaAsignaciones tbody');
            datosGuardados.forEach(({ descripcion, cantidad }) => {
                const fila = crearFila(descripcion, cantidad);
                tbody.appendChild(fila);
            });
            actualizarTotal();
        }

        function guardarDatosEnCookies() {
            const filas = document.querySelectorAll('#tablaAsignaciones tbody tr');
            const datos = Array.from(filas).map(fila => {
                return {
                    descripcion: fila.querySelector('input[type="text"]').value,
                    cantidad: parseFloat(fila.querySelector('input[type="number"]').value) || 0
                };
            });
            localStorage.setItem('asignaciones', JSON.stringify(datos));
        }

        function guardarHoras() {
            const horas = document.getElementById('horasInput').value;
            localStorage.setItem('horasMes', horas);
        }

        function crearFila(descripcion = '', cantidad = 0) {
            const fila = document.createElement('tr');

            const celdaDescripcion = document.createElement('td');
            const inputDescripcion = document.createElement('input');
            inputDescripcion.type = 'text';
            inputDescripcion.value = descripcion;
            inputDescripcion.oninput = guardarDatosEnCookies;
            celdaDescripcion.appendChild(inputDescripcion);

            const celdaCantidad = document.createElement('td');
            const inputCantidad = document.createElement('input');
            inputCantidad.type = 'number';
            inputCantidad.value = cantidad;
            inputCantidad.oninput = () => {
                actualizarTotal();
                guardarDatosEnCookies();
            };
            celdaCantidad.appendChild(inputCantidad);

            const celdaAccion = document.createElement('td');
            const botonEliminar = document.createElement('button');
            botonEliminar.textContent = 'Eliminar';
            botonEliminar.onclick = () => {
                fila.remove();
                actualizarTotal();
                guardarDatosEnCookies();
            };
            celdaAccion.appendChild(botonEliminar);

            fila.appendChild(celdaDescripcion);
            fila.appendChild(celdaCantidad);
            fila.appendChild(celdaAccion);

            return fila;
        }

        function insertarFila() {
            const tbody = document.querySelector('#tablaAsignaciones tbody');
            const nuevaFila = crearFila();
            tbody.appendChild(nuevaFila);
            guardarDatosEnCookies();
        }

        function actualizarTotal() {
            const filas = document.querySelectorAll('#tablaAsignaciones tbody tr');
            const total = Array.from(filas).reduce((suma, fila) => {
                const cantidad = parseFloat(fila.querySelector('input[type="number"]').value) || 0;
                return suma + cantidad;
            }, 0);
            document.getElementById('totalSum').innerText = total.toLocaleString();
        }

        window.onload = cargarDatosDesdeCookies;
    </script>
</body>
</html>
