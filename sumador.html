<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Cuánto llevamos?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .progress-container {
            width: 80%;
            margin: 20px auto;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 30px;
            width: 0;
            background-color: #76c7c0;
            text-align: center;
            line-height: 30px;
            color: white;
        }
        input[type="number"] {
            padding: 10px;
            margin: 10px;
            width: 200px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #76c7c0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #5baaa7;
        }
    </style>
</head>
<body>
    <h1>¿Cuánto llevamos?</h1>

    <div class="progress-container">
        <div id="progress-bar-fondos" class="progress-bar">0%</div>
    </div>

    <p id="resultado">Suma total: 0</p>
    <p id="faltante">Faltan: 40,000,000</p>

    <input type="number" id="numero" placeholder="Ingresa un monto">
    <br>
    <button onclick="sumarNumero()">Agregar</button>
    <button onclick="salir()">Salir</button>

    <script>
        // Define el objetivo (meta de fondos)
        const objetivo = 40000000; // Cambiado a 40,000,000
        let sumaTotal = parseFloat(localStorage.getItem('sumaTotal')) || 0;

        // Función para actualizar el color de acuerdo con el progreso
        function actualizarColor() {
            const porcentaje = sumaTotal / objetivo * 100;
            actualizarProgreso(document.getElementById('progress-bar-fondos'), porcentaje);
        }

        // Función para actualizar la barra de progreso
        function actualizarProgreso(barra, porcentaje) {
            barra.style.width = Math.min(porcentaje, 100) + '%';
            barra.textContent = Math.min(porcentaje, 100).toFixed(2) + '%';
            if (porcentaje >= 100) {
                barra.style.backgroundColor = '#4caf50'; // Verde al alcanzar la meta
            } else {
                barra.style.backgroundColor = '#76c7c0'; // Azul default
            }
        }

        // Inicializar los valores en la página
        document.getElementById('resultado').innerText = 'Suma total: ' + sumaTotal.toLocaleString();
        document.getElementById('faltante').innerText = 'Faltan: ' + (objetivo - sumaTotal).toLocaleString();
        actualizarColor();

        // Función para agregar un número a la suma
        function sumarNumero() {
            const numero = parseFloat(document.getElementById('numero').value);
            if (!isNaN(numero)) {
                sumaTotal += numero;
                localStorage.setItem('sumaTotal', sumaTotal);
                document.getElementById('resultado').innerText = 'Suma total: ' + sumaTotal.toLocaleString();
                document.getElementById('faltante').innerText = 'Faltan: ' + (objetivo - sumaTotal).toLocaleString();
                actualizarColor();
                document.getElementById('numero').value = '';
            }
        }

        // Función para redirigir al index.html
        function salir() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
